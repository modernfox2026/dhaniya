{% load tracker_tags %}{% if t.timer_running or t.time_spent_seconds %}<span class="timer {% if t.timer_running %}running{% endif %}" title="{% if t.timer_running %}Clock running since this task went In Progress{% else %}Time from In Progress to Completed{% endif %}" data-timer data-base="{{ t.time_spent_seconds }}" {% if t.timer_running %}data-since="{{ t.timer_started_at|date:'U' }}"{% endif %}><span class="ms">timer</span><span data-timer-text>{{ t.elapsed_seconds|duration }}</span></span>{% endif %}
