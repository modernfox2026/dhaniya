<form method="get" class="filters"><div class="filter-grid"><input name="q" value="{{ request.GET.q }}" placeholder="Search all tickets..."><select name="status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><select name="priority"><option value="">All priorities</option>{% for value,label in priorities %}<option value="{{ value }}" {% if request.GET.priority == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><select name="area"><option value="">All areas</option>{% for item in areas %}<option value="{{ item.pk }}" {% if request.GET.area == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select><select name="submitter"><option value="">All submitters</option>{% for item in submitters %}<option value="{{ item.pk }}" {% if request.GET.submitter == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.username }}</option>{% endfor %}</select><button>Apply filters</button></div><div class="filter-meta"><span>Showing {{ filtered_count }} of {{ total_count }} tickets</span><a href="{{ request.path }}">Clear filters</a></div></form>
