{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}{% block content %}<header class="topbar"><div><h1>{{ title }}</h1><p>Record implementation work, ownership, priority, and due date.</p></div></header><section class="content"><form method="post" class="panel form-panel">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}<div class="actions"><button class="primary">Save Ticket</button><a href="{% url 'backlog' %}">Cancel</a></div></form></section>{% endblock %}
